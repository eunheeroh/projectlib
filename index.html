<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서울시 도서관 현황 대시보드</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <div>
          <strong>서울도서관</strong>
          <small>현황 분석 시스템</small>
        </div>
      </div>
      <nav class="nav" aria-label="주요 메뉴">
        <button class="nav-item active" type="button" data-view="dashboard">
          <span class="nav-icon">▦</span> 대시보드
        </button>
        <button class="nav-item" type="button" data-view="directory">
          <span class="nav-icon">☷</span> 도서관 목록
        </button>
      </nav>
      <div class="sidebar-foot">
        <span>데이터 기준</span>
        <strong>서울시 공공데이터</strong>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">Seoul Library Status</p>
          <h1>서울시 도서관 현황</h1>
        </div>
        <div class="top-actions">
          <button class="icon-button" type="button" id="refreshButton" title="데이터 새로고침">↻</button>
          <button class="export-button" type="button" id="exportButton">CSV 내보내기</button>
        </div>
      </header>

      <section id="dashboardView" class="view active">
        <div class="filter-bar">
          <label class="search-box">
            <span>⌕</span>
            <input id="searchInput" type="search" placeholder="도서관명 또는 주소 검색">
          </label>
          <select id="districtFilter" aria-label="자치구">
            <option value="">전체 자치구</option>
          </select>
          <select id="typeFilter" aria-label="도서관 유형">
            <option value="">전체 유형</option>
          </select>
          <select id="ageFilter" aria-label="연령구분">
            <option value="">전체 연령구분</option>
          </select>
          <button class="reset-button" id="resetFilters" type="button">초기화</button>
        </div>

        <div class="kpi-grid">
          <article class="kpi-card accent-blue">
            <div class="kpi-top"><span>전체 도서관</span><b>LIB</b></div>
            <strong id="totalCount">-</strong>
            <small>서울시 등록 기관</small>
          </article>
          <article class="kpi-card">
            <div class="kpi-top"><span>공공도서관</span><b>PUBLIC</b></div>
            <strong id="publicCount">-</strong>
            <small id="publicShare">전체의 -%</small>
          </article>
          <article class="kpi-card">
            <div class="kpi-top"><span>작은도서관</span><b>SMALL</b></div>
            <strong id="smallCount">-</strong>
            <small id="smallShare">전체의 -%</small>
          </article>
          <article class="kpi-card">
            <div class="kpi-top"><span>운영 자치구</span><b>GU</b></div>
            <strong id="districtCount">-</strong>
            <small>서울시 25개 자치구</small>
          </article>
        </div>

        <div class="dashboard-grid">
          <article class="panel district-panel">
            <div class="panel-header">
              <div>
                <p>자치구별 현황</p>
                <h2>도서관 분포</h2>
              </div>
              <span class="panel-badge" id="districtBadge">필터 결과</span>
            </div>
            <div class="bar-chart" id="districtChart"></div>
          </article>

          <article class="panel type-panel">
            <div class="panel-header">
              <div>
                <p>도서관 유형</p>
                <h2>기관 유형 비중</h2>
              </div>
            </div>
            <div class="type-content">
              <div class="donut" id="typeDonut">
                <div class="donut-center"><strong id="donutCount">-</strong><span>전체</span></div>
              </div>
              <div class="legend" id="typeLegend"></div>
            </div>
          </article>

          <article class="panel age-panel">
            <div class="panel-header">
              <div>
                <p>이용대상 분석</p>
                <h2>연령구분별 현황</h2>
              </div>
            </div>
            <div class="age-chart" id="ageChart"></div>
          </article>

          <article class="panel recent-panel">
            <div class="panel-header">
              <div>
                <p>도서관 목록</p>
                <h2>필터 결과</h2>
              </div>
              <button class="text-button" id="viewAllButton" type="button">전체 보기 →</button>
            </div>
            <div class="library-list" id="libraryList"></div>
          </article>
        </div>
      </section>

      <section id="directoryView" class="view">
        <div class="directory-head">
          <div>
            <p class="eyebrow">Library Directory</p>
            <h2>도서관 목록</h2>
          </div>
          <span id="directoryCount" class="count-pill">0개</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>도서관명</th>
                <th>자치구</th>
                <th>관종</th>
                <th>연령구분</th>
                <th>주소</th>
                <th>운영시간</th>
              </tr>
            </thead>
            <tbody id="directoryTable"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
